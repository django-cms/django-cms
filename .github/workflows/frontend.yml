name: django CMS frontend.yml

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - run: npm install
    - name: Install the browser vitest runs the unit tests in
      run: npx playwright install --with-deps chromium
    - run: npm install -g gulp@latest
    - run: npm run test:unit
    - run: gulp lint
    - run: gulp icons
    - run: gulp sass

  integration:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'
      PYTHON_VERSION: '3.13'

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    - name: Install django CMS and the test server's dependencies
      run: |
        python -m pip install --upgrade pip uv
        uv pip install --system -r test_requirements/django-6.1.txt
    - run: npm install
    - name: Install the browser the integration tests drive
      run: npx playwright install --with-deps chromium
    - run: npm install -g gulp@latest
    - name: Run the Playwright integration tests
      run: gulp testsIntegration
      env:
        CI: true
    - name: Upload the Playwright report
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 7
